<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="AI Atlas">
  <title>AI Atlas</title>

  <!--
    A double hyphen is illegal inside an XML comment, so the design tokens
    are named without their leading dashes here. Get it wrong and the file
    stops being well-formed XML: browsers silently refuse to render it as a
    favicon, while HTML previews still look perfectly fine.
  -->
  <defs>
    <!-- Lit from the upper left, matching the globe's own light direction. -->
    <radialGradient id="sphere" cx="36%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#63d683" />
      <stop offset="52%" stop-color="#277f45" />
      <stop offset="100%" stop-color="#10331c" />
    </radialGradient>
  </defs>

  <!-- bg-base token, so the mark carries its own ground in any browser chrome. -->
  <rect width="32" height="32" rx="7" fill="#07080a" />

  <!-- Sphere in the adoption ramp: the default layer's colour. -->
  <circle cx="16" cy="16" r="11.2" fill="url(#sphere)" />

  <!--
    Equator and prime meridian only. At 16px a full graticule turns to mud;
    two lines are the minimum that still reads as a globe rather than a dot.
  -->
  <g fill="none" stroke="#07080a" stroke-opacity="0.5" stroke-width="1.1">
    <ellipse cx="16" cy="16" rx="11.2" ry="4.4" />
    <ellipse cx="16" cy="16" rx="4.4" ry="11.2" />
  </g>

  <!-- accent token, standing in for the atmosphere that rims the real globe. -->
  <circle
    cx="16"
    cy="16"
    r="12.3"
    fill="none"
    stroke="#4cc9f0"
    stroke-opacity="0.8"
    stroke-width="1.35"
  />
</svg>
